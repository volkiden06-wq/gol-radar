name: GOL RADAR Live Telegram Signals

on:
  push:
    paths:
      - "sportscore_signal_engine.py"
      - ".github/workflows/sportscore-signal-pilot.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sportscore-signal-pilot
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install requests
      - name: Kendi testlerini çalıştır
        run: python sportscore_signal_engine.py --self-test
      - name: Canlı maçları analiz et ve Telegram sinyallerini yönet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sportscore_signal_engine.py
      - name: Sinyal ve sonuç geçmişini kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sportscore_state.json
          if git diff --cached --quiet; then
            echo "Sinyal geçmişinde değişiklik yok."
            exit 0
          fi
          git commit -m "Update GOL RADAR signals and result state"
          git pull --rebase origin main
          git push origin HEAD:main
