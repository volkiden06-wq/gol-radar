name: Gol Radar Two-Source Pilot (No Send)

on:
  push:
    paths:
      - "source_pilot.py"
      - ".github/workflows/source-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gol-radar-source-pilot
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install requests
      - name: Kaynak erişimlerini kontrol et (Telegram kapalı)
        run: python source_pilot.py
